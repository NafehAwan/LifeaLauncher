appId: com.lifea.launcher
productName: LifeaLauncher
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
copyright: Copyright © LifeaLauncher contributors
directories:
  output: release
  buildResources: build
asar: true
compression: maximum
# Only the built bundles and their runtime deps ship. Renderer deps are bundled by Vite (devDependencies).
files:
  - dist/**/*
  - '!dist/stats.html'
  - dist-electron/**/*
  - '!dist-electron/**/*.map'
  - package.json
  - build/icon.png
extraResources:
  # Built lifea-core jars (CI copies mod/build/libs/*.jar here before packaging). Optional.
  - from: resources/lifea-core
    to: lifea-core
    filter: ['*.jar']
publish:
  provider: github
  owner: nafehawan
  repo: lifealauncher
  releaseType: release
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: LifeaLauncher
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: Games
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.games
  icon: build/icon.png
  hardenedRuntime: true
linux:
  target:
    - AppImage
    - deb
  category: Game
  icon: build/icon.png
  synopsis: Fast red Minecraft launcher
  maintainer: LifeaLauncher <lifealauncher@users.noreply.github.com>
deb:
  # Electron runtime libraries; libasound2t64 is the Ubuntu 24.04+ name.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2 | libasound2t64
