name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build LifeaCore for Minecraft 1.21.4
        shell: pwsh
        working-directory: mod
        run: |
          .\gradlew.bat build --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - name: Build Tuff Client for Minecraft 26.3
        shell: pwsh
        working-directory: mod/tuff-client
        run: .\gradlew.bat build --no-daemon
      - name: Stage exact-version client mods
        shell: pwsh
        run: |
          Get-ChildItem mod/build/libs/lifea-core-*+mc*.jar | Where-Object { $_.Name -notmatch 'sources|dev' } | Copy-Item -Destination resources/lifea-core/
          Get-ChildItem mod/tuff-client/build/libs/tuff-client-*+mc*.jar | Where-Object { $_.Name -notmatch 'sources|dev' } | Copy-Item -Destination resources/lifea-core/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build NSIS installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LifeaLauncher-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
