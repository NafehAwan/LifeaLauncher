name: Release

# Builds installers and publishes them to a GitHub Release (download links on the Releases page).
# Trigger: push a tag like v1.1.0, or run it manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (defaults to package.json version)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew build --no-daemon && (cd mc1_21_11 && bash ./gradlew build --no-daemon)
        working-directory: mod
      - uses: actions/upload-artifact@v4
        with:
          name: lifea-core
          path: |
            mod/build/libs/lifea-core-*+mc*.jar
            mod/mc1_21_11/build/libs/lifea-core-*+mc*.jar
            !mod/build/libs/*-sources.jar
          if-no-files-found: error

  tuff-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew build --no-daemon
        working-directory: mod/tuff-client
      - uses: actions/upload-artifact@v4
        with:
          name: tuff-client
          path: |
            mod/tuff-client/build/libs/tuff-client-*+mc*.jar
            !mod/tuff-client/build/libs/*-sources.jar
          if-no-files-found: error

  installers:
    needs: [mod, tuff-client]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: lifea-core, path: resources/lifea-core }
      - uses: actions/download-artifact@v4
        with: { name: tuff-client, path: resources/lifea-core }
      - name: Build installers (never committed to git)
        shell: bash
        run: |
          # An unset secret arrives as "", which electron-builder reads as a certificate path.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npm run build && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Optional: set these repository secrets to sign installers.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          LIFEA_BACKEND_URL: ${{ vars.LIFEA_BACKEND_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  # One job publishes everything, so the three OS builds never race to create the release.
  # A manual run tags the current commit v<package.json version>; a tag push uses that tag.
  release:
    needs: [mod, tuff-client, installers]
    # Only publish after every required build has succeeded.
    if: ${{ needs.mod.result == 'success' && needs.tuff-client.result == 'success' && needs.installers.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            name="$GITHUB_REF_NAME"
          else
            requested='${{ inputs.version }}'
            if [[ -z "$requested" ]]; then requested="$(node -p "require('./package.json').version")"; fi
            name="${requested#v}"
            name="v$name"
          fi
          if [[ ! "$name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $name" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { pattern: installers-*, path: release, merge-multiple: true }
      - run: ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: LifeaLauncher ${{ steps.tag.outputs.name }}
          make_latest: 'true'
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
